<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>প্রো জাভাস্ক্রিপ্ট কনসোল ও এডিটর</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: {
                        'landscape': {'raw': '(orientation: landscape) and (min-width: 768px)'},
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
        @media (max-width: 767px) {
            textarea, input, select {
                font-size: 16px !important;
            }
        }
    </style>
</head>
<body id="appBody" class="bg-slate-950 text-slate-100 font-sans h-[100dvh] flex flex-col overflow-hidden">

    <!-- Header / Navbar -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-3 sm:px-6 py-2.5 flex flex-wrap justify-between items-center gap-2 shadow-lg select-none shrink-0 z-10">
        <div class="flex items-center space-x-2.5">
            <div class="bg-gradient-to-br from-yellow-500/20 to-orange-500/20 p-2 rounded-xl border border-yellow-500/30">
                <i class="fa-solid fa-bolt text-yellow-400 text-base sm:text-lg"></i>
            </div>
            <div>
                <h1 class="text-sm sm:text-base font-bold tracking-tight text-white flex items-center gap-2">
                    JS Console <span class="text-[10px] bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-1.5 py-0.5 rounded-full font-medium hidden sm:inline">Pro</span>
                </h1>
            </div>
        </div>

        <!-- Control Buttons -->
        <div class="flex items-center space-x-1.5 sm:space-x-2">
            <!-- Run Button -->
            <button onclick="runCode()" title="Run Code (Ctrl + Enter)" class="bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white px-3 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center space-x-1.5 shadow-md shadow-emerald-950/40 transition-all active:scale-95 cursor-pointer touch-manipulation">
                <i class="fa-solid fa-play text-[10px] sm:text-xs"></i>
                <span>রান</span>
            </button>
            
            <!-- Clear Code Button -->
            <button onclick="clearCode()" title="Clear Code Editor" class="bg-slate-800/80 hover:bg-amber-500/20 hover:text-amber-400 hover:border-amber-500/40 border border-slate-700/80 text-slate-300 px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center space-x-1.5 transition-all active:scale-95 cursor-pointer touch-manipulation">
                <i class="fa-solid fa-eraser text-[10px] sm:text-xs"></i>
                <span class="hidden md:inline">কোড মুছুন</span>
            </button>

            <!-- Clear Console Button -->
            <button onclick="clearConsole()" title="Clear Console Output" class="bg-slate-800/80 hover:bg-red-500/20 hover:text-red-400 hover:border-red-500/40 border border-slate-700/80 text-slate-300 px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center space-x-1.5 transition-all active:scale-95 cursor-pointer touch-manipulation">
                <i class="fa-solid fa-trash-can text-[10px] sm:text-xs"></i>
                <span class="hidden md:inline">কনসোল মুছুন</span>
            </button>

            <!-- Fullscreen Button -->
            <button onclick="toggleFullScreen()" title="Toggle Fullscreen" class="bg-slate-800/80 hover:bg-indigo-500/20 hover:text-indigo-400 hover:border-indigo-500/40 border border-slate-700/80 text-slate-300 p-2 sm:px-3 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center justify-center transition-all active:scale-95 cursor-pointer touch-manipulation">
                <i id="fullscreenIcon" class="fa-solid fa-expand text-xs sm:text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col landscape:flex-row p-2 sm:p-3 gap-2 sm:gap-3 overflow-hidden w-full max-w-[2000px] mx-auto box-border">
        
        <!-- Code Editor Section -->
        <section class="flex flex-col bg-slate-900/70 backdrop-blur rounded-2xl border border-slate-800/80 shadow-xl overflow-hidden flex-1 landscape:w-1/2 h-1/2 landscape:h-full">
            <div class="bg-slate-900 px-3.5 py-2 border-b border-slate-800 flex justify-between items-center text-xs font-semibold text-slate-400 select-none shrink-0">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-red-500/80 inline-block"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-yellow-500/80 inline-block"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-green-500/80 inline-block"></span>
                    <span class="ml-1.5 text-slate-300 text-xs font-mono">script.js</span>
                </div>
                <span class="text-[10px] uppercase tracking-wider text-slate-500 bg-slate-800/80 px-2 py-0.5 rounded">Editor</span>
            </div>
            <textarea id="codeEditor" spellcheck="false" placeholder="// আপনার কোড এখানে লিখুন...&#10;console.log('হ্যালো প্রফেশনাল কনসোল!');" class="w-full flex-1 bg-slate-950/80 text-emerald-400 p-3 sm:p-4 font-mono text-xs sm:text-sm resize-none focus:outline-none leading-relaxed selection:bg-emerald-500/30"></textarea>
        </section>

        <!-- Output / Console Section -->
        <section class="flex flex-col bg-slate-900/70 backdrop-blur rounded-2xl border border-slate-800/80 shadow-xl overflow-hidden flex-1 landscape:w-1/2 h-1/2 landscape:h-full">
            <div class="bg-slate-900 px-3.5 py-2 border-b border-slate-800 flex justify-between items-center text-xs font-semibold text-slate-400 select-none shrink-0">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-terminal text-yellow-400 text-xs"></i>
                    <span class="text-slate-300">আউটপুট কনসোল</span>
                </div>
                <span class="text-[10px] uppercase tracking-wider text-slate-500 bg-slate-800/80 px-2 py-0.5 rounded">Console</span>
            </div>
            <div id="consoleOutput" class="w-full flex-1 bg-slate-950 p-3 sm:p-4 font-mono text-xs sm:text-sm overflow-y-auto space-y-2 select-text">
                <div class="text-slate-500 italic">// কনসোল আউটপুট এখানে প্রদর্শিত হবে...</div>
            </div>
        </section>

    </main>

    <!-- JavaScript Logic -->
    <script>
        const outputContainer = document.getElementById('consoleOutput');
        const codeEditor = document.getElementById('codeEditor');
        const fullscreenIcon = document.getElementById('fullscreenIcon');

        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        const originalConsoleWarn = console.warn;

        function appendToConsole(type, args) {
            const message = args.map(arg => {
                if (typeof arg === 'object' && arg !== null) {
                    try {
                        return JSON.stringify(arg, null, 2);
                    } catch (e) {
                        return String(arg);
                    }
                }
                return String(arg);
            }).join(' ');

            const logElement = document.createElement('div');
            logElement.className = "p-2.5 rounded-xl border-l-4 font-mono text-xs sm:text-sm break-all whitespace-pre-wrap shadow-sm transition-all";

            if (type === 'log') {
                logElement.classList.add('bg-slate-900/80', 'border-emerald-500', 'text-slate-200');
            } else if (type === 'error') {
                logElement.classList.add('bg-red-950/30', 'border-red-500', 'text-red-300');
            } else if (type === 'warn') {
                logElement.classList.add('bg-yellow-950/30', 'border-yellow-500', 'text-yellow-300');
            }

            logElement.textContent = message;
            outputContainer.appendChild(logElement);
            logElement.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        console.log = function(...args) {
            originalConsoleLog.apply(console, args);
            appendToConsole('log', args);
        };

        console.error = function(...args) {
            originalConsoleError.apply(console, args);
            appendToConsole('error', args);
        };

        console.warn = function(...args) {
            originalConsoleWarn.apply(console, args);
            appendToConsole('warn', args);
        };

        function runCode() {
            const code = codeEditor.value;
            if (!code.trim()) return;

            try {
                const result = new Function(code)();
                if (result !== undefined) {
                    console.log(result);
                }
            } catch (err) {
                console.error(err.toString());
            }
        }

        function clearCode() {
            codeEditor.value = '';
            codeEditor.focus();
        }

        function clearConsole() {
            outputContainer.innerHTML = '<div class="text-slate-500 italic">// কনসোল পরিষ্কার করা হয়েছে...</div>';
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`ফুলস্ক্রিন মোড এনাবল করা যায়নি: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenIcon.className = "fa-solid fa-compress text-xs sm:text-sm";
            } else {
                fullscreenIcon.className = "fa-solid fa-expand text-xs sm:text-sm";
            }
        });

        codeEditor.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                runCode();
            }
        });
    </script>
</body>
</html>
