            { id: "146", u: "নোয়াবাদ", name: "সিংগুয়া সরকারি প্রাথমিক বিদ্যালয়", area: "সিঙ্গুয়া", m: 1139, f: 1150, t: 2289 },
            { id: "147", u: "নোয়াবাদ", name: "নোয়াবাদ সরকারি প্রাথমিক বিদ্যালয়", area: "নোয়াবাদ", m: 1633, f: 1528, t: 3161 },
            { id: "148", u: "নোয়াবাদ", name: "ঝাউতলা সরকারি প্রাথমিক বিদ্যালয়", area: "ঝাউতলা, মোলামখারচর", m: 1845, f: 1769, t: 3614 },
            { id: "149", u: "নোয়াবাদ", name: "হালগড়া সরকারি প্রাথমিক বিদ্যালয়", area: "হালগড়া, আন্দারমানিক", m: 1203, f: 1185, t: 2388 },
            { id: "150", u: "নোয়াবাদ", name: "সিন্দ্বীপ সরকারি প্রাথমিক বিদ্যালয়", area: "সিন্দ্বীপ", m: 1043, f: 974, t: 2017 },
            { id: "151", u: "নোয়াবাদ", name: "উলুখলা সরকারি প্রাথমিক বিদ্যালয়", area: "উত্তর ও দক্ষিণ উলুখলা", m: 1635, f: 1627, t: 3262 }
        ];

        // --- 2. LOGIC: Data Processing & Idilpur Fix ---
        function getBanglaToEnglish(str) {
            const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            let res = str.toString();
            for(let i=0; i<10; i++) res = res.replace(new RegExp(bn[i], 'g'), i);
            return parseInt(res.replace(/,/g, ''));
        }

        function getEnglishToBangla(num) {
            if(!num && num !== 0) return '০';
            const bn = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            return num.toString().split('').map(c => bn[c] || c).join('');
        }

        const processedData = rawCenters.map(center => {
            const villages = center.area.split(',').map(v => v.trim());
            const totalVoters = center.t;
            const totalMale = center.m;
            const totalFemale = center.f;
            const hijra = center.h || 0;
            let areas = [];

            // --- SPECIAL FIX FOR IDILPUR (CENTER 1) ---
            if(center.id === "1") {
                // Total M: 2335, F: 2354
                // Idilpur: M: 85, F: 95
                // Remaining: M: 2250, F: 2259
                // Remaining Villages: 3
                let remM = 2250, remF = 2259;
                
                villages.forEach((vName, idx) => {
                    if(vName.includes("ইদিলপুর")) {
                        areas.push({ name: vName, m: 85, f: 95, t: 180 });
                    } else if(idx === villages.length - 1) {
                        // Last one takes remainder
                        areas.push({ name: vName, m: remM, f: remF, t: remM + remF });
                    } else {
                        // Distribute approx
                        let mShare = Math.floor(2250 / 3);
                        let fShare = Math.floor(2259 / 3);
                        remM -= mShare; remF -= fShare;
                        areas.push({ name: vName, m: mShare, f: fShare, t: mShare + fShare });
                    }
                });
            } else {
                // Default Distribution Logic
                let remainingMale = totalMale;
                let remainingFemale = totalFemale;
                
                areas = villages.map((vName, index) => {
                    if (index === villages.length - 1) {
                        return { name: vName, m: remainingMale, f: remainingFemale, t: remainingMale + remainingFemale };
                    }
                    const mShare = Math.floor(totalMale / villages.length);
                    const fShare = Math.floor(totalFemale / villages.length);
                    remainingMale -= mShare;
                    remainingFemale -= fShare;
                    return { name: vName, m: mShare, f: fShare, t: mShare + fShare };
                });
            }

            return {
                id: getEnglishToBangla(center.id),
                name: center.name,
                upazila: parseInt(center.id) <= 51 ? "তাড়াইল" : "করিমগঞ্জ",
                union: center.u,
                areas: areas,
                total: center.t,
                male: center.m,
                female: center.f,
                hijra: hijra,
                comment: center.comment || "পুরুষ ও মহিলা ভোটকেন্দ্র"
            };
        });

        // --- 3. SUMMARY LOGIC ---
        function generateSummary() {
            const summaryData = {};
            let grandTotalM = 0;
            let grandTotalF = 0;
            let grandTotalH = 0;
            let grandTotalT = 0;
            let grandTotalCenters = processedData.length;
            let uniqueUnions = new Set();
            let totalAreasCount = 0;

            processedData.forEach(c => {
                // Upazila/Union Aggregation
                if (!summaryData[c.upazila]) summaryData[c.upazila] = {};
                if (!summaryData[c.upazila][c.union]) {
                    summaryData[c.upazila][c.union] = { m: 0, f: 0, h: 0, t: 0, centers: 0 };
                }
                
                summaryData[c.upazila][c.union].m += c.male;
                summaryData[c.upazila][c.union].f += c.female;
                summaryData[c.upazila][c.union].h += c.hijra;
                summaryData[c.upazila][c.union].t += c.total;
                summaryData[c.upazila][c.union].centers += 1;

                // Grand Totals
                grandTotalM += c.male;
                grandTotalF += c.female;
                grandTotalH += c.hijra;
                grandTotalT += c.total;
                uniqueUnions.add(c.union);
                totalAreasCount += c.areas.length;
            });

            // --- Generate HTML ---
            let html = '';

            // 1. Grand Summary Card
            html += `
                <div class="bg-gradient-to-r from-slate-800 to-slate-900 text-white p-6 rounded-2xl shadow-lg mb-8">
                    <div class="flex flex-col md:flex-row justify-between items-center border-b border-slate-700 pb-4 mb-4">
                        <div>
                            <h2 class="text-2xl font-bold">কিশোরগঞ্জ-৩</h2>
                            <p class="text-sm text-slate-400">সামগ্রিক পরিসংখ্যান (২০২৬)</p>
                        </div>
                        <div class="text-right mt-2 md:mt-0">
                            <p class="text-xs text-slate-400 uppercase tracking-widest">মোট কেন্দ্র</p>
                            <p class="text-3xl font-bold font-code text-brand-400">${getEnglishToBangla(grandTotalCenters)}</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                        <div class="bg-white/10 rounded-lg p-3">
                            <p class="text-xs text-slate-300 mb-1">মোট ভোটার</p>
                            <p class="text-xl font-bold font-code">${getEnglishToBangla(grandTotalT)}</p>
                        </div>
                        <div class="bg-blue-500/20 rounded-lg p-3 border border-blue-500/30">
                            <p class="text-xs text-blue-200 mb-1">পুরুষ</p>
                            <p class="text-xl font-bold font-code">${getEnglishToBangla(grandTotalM)}</p>
                        </div>
                        <div class="bg-pink-500/20 rounded-lg p-3 border border-pink-500/30">
                            <p class="text-xs text-pink-200 mb-1">মহিলা</p>
                            <p class="text-xl font-bold font-code">${getEnglishToBangla(grandTotalF)}</p>
                        </div>
                        <div class="bg-purple-500/20 rounded-lg p-3 border border-purple-500/30">
                            <p class="text-xs text-purple-200 mb-1">হিজড়া</p>
                            <p class="text-xl font-bold font-code">${getEnglishToBangla(grandTotalH)}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-slate-700">
                        <div class="flex justify-between px-2">
                            <span class="text-sm text-slate-400">ইউনিয়ন/পৌরসভা</span>
                            <span class="font-bold font-code">${getEnglishToBangla(uniqueUnions.size)}</span>
                        </div>
                        <div class="flex justify-between px-2 border-l border-slate-700">
                            <span class="text-sm text-slate-400">গ্রাম/এলাকা</span>
                            <span class="font-bold font-code">${getEnglishToBangla(totalAreasCount)}</span>
                        </div>
                    </div>
                </div>
            `;
            
            // 2. Upazila Tables
            for (const [upazila, unions] of Object.entries(summaryData)) {
                let uM = 0, uF = 0, uH = 0, uT = 0, uC = 0;

                html += `
                    <div class="mb-10">
                        <div class="flex items-center gap-3 mb-4">
                            <h3 class="text-xl font-bold text-slate-800 border-l-4 border-brand-500 pl-3">${upazila} উপজেলা</h3>
                        </div>
                        <div class="bg-white rounded-lg border border-slate-200 overflow-hidden shadow-sm">
                            <table class="w-full text-sm">
                                <thead class="bg-slate-100 text-slate-600 font-semibold uppercase tracking-wider">
                                    <tr>
                                        <th class="px-4 py-3 text-left">ইউনিয়ন/পৌরসভা</th>
                                        <th class="px-4 py-3 text-center">কেন্দ্র</th>
                                        <th class="px-4 py-3 text-right text-blue-600">পুরুষ</th>
                                        <th class="px-4 py-3 text-right text-pink-600">মহিলা</th>
                                        <th class="px-4 py-3 text-right text-purple-600">হিজড়া</th>
                                        <th class="px-4 py-3 text-right text-slate-800">মোট ভোটার</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                `;

                for (const [union, data] of Object.entries(unions)) {
                    uM += data.m; uF += data.f; uH += data.h; uT += data.t; uC += data.centers;

                    html += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-4 py-2.5 font-medium text-slate-700">${union}</td>
                            <td class="px-4 py-2.5 text-center text-slate-500 font-code">${getEnglishToBangla(data.centers)}</td>
                            <td class="px-4 py-2.5 text-right font-code text-blue-600/90">${getEnglishToBangla(data.m)}</td>
                            <td class="px-4 py-2.5 text-right font-code text-pink-600/90">${getEnglishToBangla(data.f)}</td>
                            <td class="px-4 py-2.5 text-right font-code text-purple-600/90">${data.h > 0 ? getEnglishToBangla(data.h) : '-'}</td>
                            <td class="px-4 py-2.5 text-right font-bold text-slate-800 font-code">${getEnglishToBangla(data.t)}</td>
                        </tr>
                    `;
                }

                html += `
                                </tbody>
                                <tfoot class="bg-slate-50 font-bold text-slate-900 border-t-2 border-slate-200">
                                    <tr>
                                        <td class="px-4 py-3">সর্বমোট</td>
                                        <td class="px-4 py-3 text-center font-code">${getEnglishToBangla(uC)}</td>
                                        <td class="px-4 py-3 text-right text-blue-700 font-code">${getEnglishToBangla(uM)}</td>
                                        <td class="px-4 py-3 text-right text-pink-700 font-code">${getEnglishToBangla(uF)}</td>
                                        <td class="px-4 py-3 text-right text-purple-700 font-code">${getEnglishToBangla(uH)}</td>

            }
            
            document.getElementById('summaryContent').innerHTML = html;
        }

        // --- 4. RENDER & INTERACTION ---
        function openSummary() {
            generateSummary();
            document.getElementById('summaryModal').classList.remove('hidden');
        }

        function closeSummary() {
            document.getElementById('summaryModal').classList.add('hidden');
        }

        function renderCardHTML(center, isForImage = false) {
            let rows = '';
            center.areas.forEach(a => {
                rows += `
                    <tr class="border-b border-slate-100 last:border-0 ${isForImage ? '' : 'hover:bg-slate-50'}">
                        <td class="py-1.5 px-3 text-slate-700 font-medium text-xs">${a.name}</td>
                        <td class="py-1.5 px-3 text-right text-blue-600 font-code text-xs">${getEnglishToBangla(a.m)}</td>
                        <td class="py-1.5 px-3 text-right text-pink-600 font-code text-xs">${getEnglishToBangla(a.f)}</td>
                        <td class="py-1.5 px-3 text-right text-slate-800 font-bold font-code text-xs">${getEnglishToBangla(a.t)}</td>
                    </tr>
                `;
            });

            let hijraRow = center.hijra > 0 ? 
                `<div class="mt-2 text-[10px] text-center bg-purple-50 text-purple-700 py-1 rounded border border-purple-100 font-bold">হিজড়া ভোটার: ${getEnglishToBangla(center.hijra)} জন</div>` : '';

            let typeBadge = '';
            if (center.comment.includes("পুরুষ") && center.comment.includes("মহিলা")) {
                typeBadge = '<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded border border-emerald-200">পুরুষ ও মহিলা কেন্দ্র</span>';
            } else if (center.comment.includes("মহিলা")) {
                typeBadge = '<span class="bg-pink-100 text-pink-700 px-2 py-0.5 rounded border border-pink-200">মহিলা কেন্দ্র</span>';
            } else if (center.comment.includes("পুরুষ")) {
                typeBadge = '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded border border-blue-200">পুরুষ কেন্দ্র</span>';
            }

            return `
                <div class="bg-white rounded-xl overflow-hidden ${isForImage ? '' : 'border border-slate-200 shadow-sm hover:shadow-md transition-all duration-300 group'} h-full flex flex-col relative">
                    <div class="watermark opacity-10">&lt;NakibLab /&gt;</div>
                    <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-brand-500 to-emerald-400"></div>
                    <div class="p-5 relative z-10 flex-1 flex flex-col">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="font-bold text-lg text-slate-800 leading-snug mb-1 group-hover:text-brand-600 transition-colors">${center.name}</h3>
                                <div class="flex flex-wrap items-center gap-2 text-xs font-medium text-slate-500 mt-2">
                                    <span class="bg-slate-100 px-2 py-0.5 rounded flex items-center gap-1 border border-slate-200"><i data-lucide="map-pin" class="w-3 h-3"></i> ${center.union} (${center.upazila})</span>
                                    <span class="bg-slate-100 px-2 py-0.5 rounded border border-slate-200">ক্রমিক: ${center.id}</span>
                                    ${typeBadge}
                                </div>
                            </div>
                        </div>
                        <div class="border border-slate-200 rounded-lg overflow-hidden bg-white/90 backdrop-blur-sm flex-1">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 border-b border-slate-200">
                                    <tr>
                                        <th class="py-2 px-3 text-[10px] uppercase font-bold text-slate-500 tracking-wider">এলাকা</th>
                                        <th class="py-2 px-3 text-right text-[10px] uppercase font-bold text-blue-500 tracking-wider">পু</th>
                                        <th class="py-2 px-3 text-right text-[10px] uppercase font-bold text-pink-500 tracking-wider">ম</th>
                                        <th class="py-2 px-3 text-right text-slate-100 tracking-wider">মোট</th>
                                    </tr>
                                </thead>
                                <tbody>${rows}</tbody>
                                <tfoot class="bg-slate-100 border-t border-slate-200 text-xs font-bold">
                                    <tr>
                                        <td class="py-2 px-3 text-slate-700">সর্বমোট</td>
                                        <td class="py-2 px-3 text-right text-blue-700 font-code">${getEnglishToBangla(center.male)}</td>
                                        <td class="py-2 px-3 text-right text-pink-700 font-code">${getEnglishToBangla(center.female)}</td>
                                        <td class="py-2 px-3 text-right text-slate-900 font-code">${getEnglishToBangla(center.total)}</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                        ${hijraRow}
                    </div>
                    ${isForImage ? `<div class="bg-brand-500 text-white text-[10px] py-2 px-4 flex justify-between items-center font-code relative z-20 mt-auto"><span>Generated by NakibLab</span><span>Kishoreganj-3 (2026)</span></div>` : ''}
                </div>
            `;
        }

        function renderGrid(data) {
            const grid = document.getElementById('gridContainer');
            grid.innerHTML = '';
            data.forEach(center => {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = renderCardHTML(center);
                wrapper.firstChild.nextSibling.classList.add('cursor-pointer');
                wrapper.firstChild.nextSibling.onclick = () => openModal(center);
                grid.appendChild(wrapper.firstChild.nextSibling);
            });
            lucide.createIcons();
            document.getElementById('count').textContent = getEnglishToBangla(data.length);
        }

        function openModal(center) {
            const content = document.getElementById('modalContent');
            content.innerHTML = `<div class="w-full" style="min-width: 450px;">${renderCardHTML(center, true)}</div>`;
            document.getElementById('modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function downloadSingle() {
            const el = document.getElementById('modalContent').firstChild;
            html2canvas(el, { scale: 3 }).then(canvas => {
                const name = el.querySelector('h3').innerText.substring(0, 15);
                canvas.toBlob(blob => saveAs(blob, `Center_${name}.png`));
            });
        }

        async function downloadAll() {
            const btn = document.getElementById('batchBtn');
            if(!confirm("১৫১টি কেন্দ্রের ছবি জেনারেট হতে কিছুক্ষণ সময় লাগতে পারে। শুরু করবেন?")) return;
            
            const originalText = btn.innerHTML;
            btn.innerHTML = 'প্রসেসিং...';
            btn.disabled = true;

            const zip = new JSZip();
            const folder = zip.folder("Kishoreganj3_2026_NakibLab");
            const container = document.getElementById('renderContainer');
            container.style.width = "500px";

            for(let i=0; i<processedData.length; i++) {
                const c = processedData[i];
                container.innerHTML = renderCardHTML(c, true);
                const canvas = await html2canvas(container.firstElementChild, { scale: 2 });
                const blob = await new Promise(r => canvas.toBlob(r));
                const safeName = c.name.replace(/[^\w\u0980-\u09FF]/g, '_').substring(0, 30);
                folder.file(`${c.id}_${safeName}.png`, blob);
            }

            const zipBlob = await zip.generateAsync({type:"blob"});
            saveAs(zipBlob, "Kishoreganj3_2026_NakibLab.zip");
            
            btn.innerHTML = originalText;
            btn.disabled = false;
            container.innerHTML = '';
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = processedData.filter(c => 
                c.name.toLowerCase().includes(val) || 
                c.id.includes(val) ||
                c.areas.some(a => a.name.toLowerCase().includes(val)) ||
                c.union.toLowerCase().includes(val)
            );
            renderGrid(filtered);
        });

        renderGrid(processedData);
    </script>
</body>
